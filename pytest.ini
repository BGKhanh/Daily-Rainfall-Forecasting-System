[pytest]
minversion = 7.0
pythonpath = .
addopts = -ra
markers =
    tier1: Fast Tier 1 CI checks (API, HCMC lock, CERES validation, golden 30-day parity, SQLite DDL V3 triggers/transactions)
    tier2: Tier 2 full-data parity (2,908 Val+Test origins), container smoke checks, and offline Phase 0 contracts
norecursedirs = .git .venv mlruns scratch tasks __pycache__
