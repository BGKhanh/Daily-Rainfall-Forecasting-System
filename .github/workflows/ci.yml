name: Backend Serving CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  tier1-ci:
    name: Tier 1 CI — Ruff Lint, Serving Unit/Golden Parity & SQLite DDL V3 Trigger Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-serving.txt"

      - name: Install serving & test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-serving.txt
          pip install pytest httpx ruff psutil

      - name: Run Ruff lint on serving backend & storage DDL V3
        run: |
          ruff check src/api src/inference src/data/provider.py src/data/vintage_store.py scripts/mlops/export_from_registry.py scripts/mlops/run_operational_checks.py tests/serving tests/storage

      - name: Run Tier 1 suite (API HCMC Lock, CERES Gates, Golden Parity, DDL V3 Triggers/Seed)
        env:
          SERVING_MODEL_SOURCE: local
          WEATHER_DB_BACKEND: local
        run: |
          python -m pytest tests/serving/ tests/storage/ -v

  docker-smoke:
    name: Tier 2 CI — Docker Container Build, Linux Parity & RSS Smoke Check
    runs-on: ubuntu-latest
    needs: tier1-ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build serving Docker image
        run: |
          docker build -t kgb0630/ds_108:1.1.0-serving .

      - name: Run container & verify /health, /predict, and RSS <= 350 MB
        run: |
          set -e
          docker run -d --name ds108-smoke -p 8000:8000 kgb0630/ds_108:1.1.0-serving
          trap "docker rm -f ds108-smoke || true" EXIT

          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done

          cat /tmp/health.json
          grep -Eq '"status":\s*"healthy"' /tmp/health.json

          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"province": "TP. Hồ Chí Minh"}' > /tmp/predict.json

          python3 - <<'EOF'
          import json
          with open("/tmp/predict.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          assert data["lag_days"] == 3, data
          assert data["effective_future_days"] == 4, data
          preds = data["serving_model"]["predictions_7d_mm"]
          assert len(preds) == 7 and all(p >= 0.0 for p in preds), preds
          print("Docker /predict smoke verified:", preds)
          EOF

          RSS_KB=$(docker exec ds108-smoke python3 -c "import os; print(sum(int(line.split()[1]) for line in open('/proc/1/status') if line.startswith('VmRSS:')))")
          RSS_MB=$(python3 -c "print(round(${RSS_KB} / 1024.0, 2))")
          echo "Container Uvicorn VmRSS = ${RSS_MB} MB"
          python3 -c "assert ${RSS_MB} <= 350.0, f'RSS {RSS_MB} MB exceeded 350 MB limit'"

  registry-verify:
    name: DagsHub MLflow Registry Checksum Audit (Optional)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify DagsHub token secret availability
        id: check_secret
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
        run: |
          if [ -n "$DAGSHUB_TOKEN" ]; then
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
            echo "Skipping MLflow Registry audit: DAGSHUB_USER_TOKEN secret not configured."
          fi

      - name: Set up Python 3.12
        if: steps.check_secret.outputs.has_secret == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MLflow verification dependencies
        if: steps.check_secret.outputs.has_secret == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-serving.txt mlflow==3.18.0

      - name: Audit Registry Aliases & SHA-256 Digests
        if: steps.check_secret.outputs.has_secret == 'true'
        env:
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI || 'https://dagshub.com/BGKhanh/Precipitation-EDA.mlflow' }}
          MLFLOW_TRACKING_USERNAME: ${{ vars.MLFLOW_TRACKING_USERNAME || 'BGKhanh' }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_USER_TOKEN }}
        run: |
          python scripts/mlops/export_from_registry.py --verify-only

