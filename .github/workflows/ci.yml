name: Backend Serving CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  # Tier 1 CI: Fast stateless verification (~60s) on Ubuntu — Ruff lint, serving API/OpenAPI/column-guard,
  # timestamp opposing-format checks, and SQLite DDL V3.2 triggers/seed tests. Runs without live DB or NASA calls.
  tier1-ci:
    name: Tier 1 CI — Ruff Lint, Serving Unit/Golden Parity & SQLite DDL V3 Trigger Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-serving.txt"

      - name: Install serving & test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-serving.txt
          pip install pytest httpx ruff psutil

      - name: Ensure hydrated demo_rainfall_vintage.db (LFS fallback)
        run: |
          python scripts/mlops/ensure_demo_db.py

      - name: Run Ruff lint on serving backend & storage DDL V3
        run: |
          ruff check src/api src/config/clock.py src/config/settings.py src/inference src/data/provider.py src/data/vintage_store.py src/data/grid_overlap.py src/data/turso_backend.py src/featurengineering/builder.py scripts/mlops/export_from_registry.py scripts/mlops/run_operational_checks.py scripts/mlops/run_forecast_ledger.py scripts/mlops/ensure_demo_db.py scripts/mlops/automated_pipeline.py scripts/mlops/verify_turso_parity_and_costs.py scripts/mlops/migrate_ledger_v35_audited.py scripts/audit/audit_db_storage_footprint.py research/imputer_benchmark/run_pc_integration_experiment.py tests/serving tests/storage tests/test_pc_solar_imputation_contract.py

      - name: Run Tier 1 suite (API OpenAPI/Scores Contract, Clock, Column Guard, 2184-Origin Parity, DDL V3.5, P-c Solar Imputation)
        env:
          SERVING_MODEL_SOURCE: local
          WEATHER_DB_BACKEND: local
          CI_REQUIRE_PARITY: "1"
        run: |
          python -m pytest tests/serving/ tests/storage/ tests/test_pc_solar_imputation_contract.py -v -rs

      - name: Set up Node.js 24 & verify frontend SPA tests + production build
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Run frontend Vitest suite & Vite build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  # Tier 2 CI: Builds the production Linux container (bundling demo_rainfall_vintage.db), verifies cold-start
  # Uvicorn boot, /health, /models, /predict (demo DB + lag=3 parity), /scores (122 anchors + Block Bootstrap CI),
  # and strict VmRSS <= 350 MB memory budget.
  docker-smoke:
    name: Tier 2 CI — Docker Container Build, Linux Parity & RSS Smoke Check
    runs-on: ubuntu-latest
    needs: tier1-ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.12 for LFS fallback check
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-serving.txt"

      - name: Ensure hydrated demo_rainfall_vintage.db before Docker build
        run: |
          pip install -r requirements-serving.txt
          python scripts/mlops/ensure_demo_db.py

      - name: Build serving Docker image
        run: |
          docker build -t kgb0630/ds_108:1.7.0-serving .

      - name: Run container & verify /, /locations, /observations, /health, /models, /predict, /scores, and RSS <= 350 MB
        run: |
          set -e
          docker run -d --name ds108-smoke -p 8000:8000 kgb0630/ds_108:1.7.0-serving
          trap "docker rm -f ds108-smoke || true" EXIT

          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done

          cat /tmp/health.json
          curl -sf http://localhost:8000/ > /tmp/index.html
          curl -sf http://localhost:8000/locations > /tmp/locations.json
          curl -sf "http://localhost:8000/observations" > /tmp/obs_daily.json
          curl -sf "http://localhost:8000/observations?location_id=HANOI" > /tmp/obs_hanoi.json
          curl -sf http://localhost:8000/models > /tmp/models.json
          curl -sf "http://localhost:8000/scores?eval_split_regime=POST_TEST" > /tmp/scores.json
          curl -sf "http://localhost:8000/benchmark/leaderboard?limit=3" > /tmp/leaderboard.json

          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"province": "TP. Hồ Chí Minh"}' > /tmp/predict_demo.json

          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"location_id": "HCMC", "anchor_date": "2026-08-30"}' > /tmp/predict_anchor.json

          python3 - <<'EOF'
          import json
          with open("/tmp/index.html", "r", encoding="utf-8") as f:
              html = f.read()
          assert "<div id=\"root\"></div>" in html, "SPA index.html not served at /"

          with open("/tmp/locations.json", "r", encoding="utf-8") as f:
              locs = json.load(f)
          assert locs["db_role"] == "bundled_demo_db", locs
          assert len(locs["locations"]) == 1 and locs["locations"][0]["location_id"] == "HCMC", locs
          assert locs["locations"][0]["display_name"] == "Ho Chi Minh City", locs

          with open("/tmp/health.json", "r", encoding="utf-8") as f:
              health = json.load(f)
          assert health["status"] == "healthy", health
          assert health["db_role"] == "bundled_demo_db", health
          assert health["default_complete_anchor_date"] == "2026-11-17", health
          assert health["data_snapshot_date"] is not None, health
          assert health["scan_window_start"] is not None and health["scan_window_total_days"] > 0, health
          assert health["latest_precip_obs_date"] is not None, health
          assert health["latest_partial_obs_explanation"], health
          assert health["anchor_range"] == {"min": "2001-02-04", "max": "2026-11-17"}, health
          assert set(health["data_latency"]["groups"].keys()) == {"METEO_GEOSIT", "RAD_FLASHFLUX", "RAD_CERES_SYN1DEG"}
          assert health["journal_mode"] == "delete", health

          with open("/tmp/obs_daily.json", "r", encoding="utf-8") as f:
              obsd = json.load(f)
          assert obsd["location_id"] == "HCMC" and obsd["has_data"] is True and len(obsd["series"]) == 90, obsd.keys()
          assert obsd["finality_mode"] == "source_header_transition" and obsd["finality_cutoff_date"] == "2026-09-30"
          assert len(obsd["forecast_overlay"]) == 7

          with open("/tmp/obs_hanoi.json", "r", encoding="utf-8") as f:
              obsh = json.load(f)
          assert obsh["location_id"] == "HANOI" and obsh["has_data"] is False

          with open("/tmp/models.json", "r", encoding="utf-8") as f:
              models = json.load(f)
          assert "demo_rainfall_vintage.db" in models["sha256_checksums"], models["sha256_checksums"]
          assert "baseline_persistence" in models["models"] and "baseline_climatology_doy" in models["models"]

          with open("/tmp/scores.json", "r", encoding="utf-8") as f:
              scores = json.load(f)
          assert scores["n_origins"] == 122, scores
          assert scores["n_forecasts_per_model"] == 854, scores
          assert scores["block_bootstrap"]["block_length"] == 7, scores["block_bootstrap"]
          assert scores["block_bootstrap"]["n_blocks"] == 18, scores["block_bootstrap"]
          assert {"SC-35 - SC-31", "SC-35 - SC-30", "SC-30 - SC-31"}.issubset(scores["pairwise_delta_mae_ci"].keys())
          assert scores["pairwise_delta_mae_ci"]["SC-30 - SC-31"]["decision_label"] == "Borderline, not adjusted for multiple comparisons"
          assert set(scores["block_length_sensitivity"].keys()) == {"7", "14", "21"}
          assert len(scores["methodological_notes"]) == 3

          with open("/tmp/leaderboard.json", "r", encoding="utf-8") as f:
              lb = json.load(f)
          assert "test_set_exposure_note" in lb and "config_note" in lb

          with open("/tmp/predict_demo.json", "r", encoding="utf-8") as f:
              pdemo = json.load(f)
          assert pdemo["history_backend"] == "sqlite", pdemo
          assert pdemo["anchor_date"] == "2026-11-17", pdemo
          assert pdemo["anchor_split_regime"] == "POST_TEST", pdemo
          assert pdemo["run_timezone"] == "Asia/Ho_Chi_Minh", pdemo
          assert pdemo["is_degraded_input"] is True, pdemo
          assert pdemo["ceres_policy_applied"] == "P-c_DOY_MEDIAN_11_SOLAR_V1", pdemo
          assert len(pdemo["daily_forecasts"]) == 7

          with open("/tmp/predict_anchor.json", "r", encoding="utf-8") as f:
              panchor = json.load(f)
          preds = panchor["serving_model"]["predictions_7d_mm"]
          assert len(preds) == 7 and all(p >= 0.0 for p in preds), preds
          print("Docker smoke verified (/, /locations, /health, /models, /scores, /benchmark/leaderboard, /predict):", preds)
          EOF

          if docker exec ds108-smoke sh -c "command -v node >/dev/null 2>&1"; then
            echo "ERROR: node binary leaked into runtime image!"
            exit 1
          fi

          RSS_KB=$(docker exec ds108-smoke python3 -c "import os; print(sum(int(line.split()[1]) for line in open('/proc/1/status') if line.startswith('VmRSS:')))")
          RSS_MB=$(python3 -c "print(round(${RSS_KB} / 1024.0, 2))")
          echo "Container Uvicorn VmRSS = ${RSS_MB} MB"
          python3 -c "assert ${RSS_MB} <= 350.0, f'RSS {RSS_MB} MB exceeded 350 MB limit'"

  registry-verify:
    name: DagsHub MLflow Registry Checksum Audit (Optional)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify DagsHub token secret availability
        id: check_secret
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
        run: |
          if [ -n "$DAGSHUB_TOKEN" ]; then
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
            echo "Skipping MLflow Registry audit: DAGSHUB_USER_TOKEN secret not configured."
          fi

      - name: Set up Python 3.12
        if: steps.check_secret.outputs.has_secret == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MLflow verification dependencies
        if: steps.check_secret.outputs.has_secret == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-serving.txt mlflow==3.18.0

      - name: Audit Registry Aliases & SHA-256 Digests
        if: steps.check_secret.outputs.has_secret == 'true'
        env:
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI || 'https://dagshub.com/BGKhanh/Daily-Rainfall-Forecasting-System.mlflow' }}
          MLFLOW_TRACKING_USERNAME: ${{ vars.MLFLOW_TRACKING_USERNAME || 'BGKhanh' }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_USER_TOKEN }}
        run: |
          python scripts/mlops/export_from_registry.py --verify-only

