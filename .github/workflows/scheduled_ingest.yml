name: Scheduled NASA POWER Ingest & Forecast Issuance

on:
  schedule:
    # Off-peak 20:23 UTC (~03:23 Asia/Ho_Chi_Minh) to avoid top-of-hour queue congestion.
    # Note (GitHub Docs, accessed 2026-11-20):
    # - Scheduled workflows can be delayed or dropped under heavy GitHub Actions load
    #   (https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#schedule).
    # - Public repositories with no commit activity for 60 consecutive days automatically
    #   disable scheduled triggers until manually re-enabled or a new commit is pushed
    #   (https://docs.github.com/en/actions/managing-workflow-runs-and-deployments/managing-workflow-runs/disabling-and-enabling-a-workflow).
    - cron: "23 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run probe/forecast issuance in dry-run mode without mutating Turso"
        required: false
        default: false
        type: boolean

concurrency:
  group: ds108-vintage-ingest
  cancel-in-progress: false

jobs:
  daily-vintage-pipeline:
    name: Daily NASA POWER Scan & Idempotent Forecast Issuance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STORE_BACKEND: turso_remote
      TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
      TURSO_DB_TOKEN: ${{ secrets.TURSO_DB_TOKEN }}
      REFRESH_WEBHOOK_URL: ${{ secrets.CACHE_REFRESH_WEBHOOK_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-serving.txt"

      - name: Install serving pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-serving.txt

      - name: Check Turso secret availability
        id: creds
        run: |
          if [ -n "${TURSO_DB_URL}" ] && [ -n "${TURSO_DB_TOKEN}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Turso secrets not configured in this context; remote pipeline steps skipped safely."
          fi

      - name: Probe NASA POWER header.sources transition cutoffs
        if: steps.creds.outputs.ready == 'true'
        run: |
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY_FLAG="--dry-run"; fi
          python scripts/mlops/automated_pipeline.py --backend turso_remote probe-headers $DRY_FLAG

      - name: Incremental NASA POWER window ingestion
        if: steps.creds.outputs.ready == 'true' && inputs.dry_run != true
        run: |
          python scripts/mlops/automated_pipeline.py --backend turso_remote ingest-window

      - name: Issue forecasts only for new COMPLETE_ALL_35 anchors
        if: steps.creds.outputs.ready == 'true'
        run: |
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY_FLAG="--dry-run"; fi
          python scripts/mlops/automated_pipeline.py --backend turso_remote issue-forecasts $DRY_FLAG

      - name: Refresh store state key and optional serving webhook
        if: steps.creds.outputs.ready == 'true' && inputs.dry_run != true
        run: |
          WEBHOOK_ARGS=""
          if [ -n "${REFRESH_WEBHOOK_URL}" ]; then WEBHOOK_ARGS="--webhook-url ${REFRESH_WEBHOOK_URL}"; fi
          python scripts/mlops/automated_pipeline.py --backend turso_remote refresh-cache $WEBHOOK_ARGS
